name: 发布 Linux amd64 插件

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
      GOOS: linux
      GOARCH: amd64
      PLUGIN_ID: newapi-provider
    steps:
      - name: 检出 tag 对应源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 校验正式版本 tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '不支持的版本 tag：%s；请使用 vX.Y.Z。\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: 按 go.mod 设置 Go 版本
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建并打包正式插件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build dist
          # 从模块声明推导版本变量路径，使注册版本与 tag 一致。
          module_path="$(go list -m)"
          go build -mod=readonly -trimpath -buildmode=c-shared \
            -ldflags "-X ${module_path}/internal/plugin.pluginVersion=${VERSION}" \
            -o "build/${PLUGIN_ID}.so" .
          # 只打包共享库，排除自动生成的 C 头文件，并保持 ZIP 根目录布局。
          zip -j "dist/${PLUGIN_ID}_${VERSION}_linux_amd64.zip" "build/${PLUGIN_ID}.so"
          (
            cd dist
            sha256sum "${PLUGIN_ID}_${VERSION}_linux_amd64.zip" > checksums.txt
            sha256sum -c checksums.txt
          )

      - name: 发布 Release 及校验和
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 仅使用已推送的 tag；全部产物生成成功后才开始创建 Release。
          gh release create "$RELEASE_TAG" \
            "dist/${PLUGIN_ID}_${VERSION}_linux_amd64.zip" \
            dist/checksums.txt \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
